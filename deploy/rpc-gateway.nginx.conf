# Public RPC gateway for the core-network alpha (docs/core-network-alpha.md,
# "Secure public RPC access").
#
# This host's only job is TLS termination and rate limiting in front of a
# validator whose own RPC stays bound to loopback, as generated by
# `chain-node devnet init` / a release genesis. It is deliberately not a
# custom binary: nginx's TLS and `limit_req` have been produced and reviewed
# far more than anything this project would write from scratch this early.
#
# Install (Debian/Ubuntu example):
#   apt-get install nginx certbot python3-certbot-nginx
#   cp deploy/rpc-gateway.nginx.conf /etc/nginx/sites-available/thrylos-rpc
#   ln -s /etc/nginx/sites-available/thrylos-rpc /etc/nginx/sites-enabled/
#   # Edit server_name below, then:
#   certbot --nginx -d rpc.testnet.example
#   nginx -t && systemctl reload nginx
#
# certbot rewrites this file's `listen`/`ssl_certificate` lines in place; keep
# everything else (rate limits, proxy rules) as the source of truth and
# re-apply it if certbot's renewal hook ever regenerates the file from
# scratch.

# One shared state table for the rate limit, sized for roughly 160,000
# tracked IPs at ~10 MB. `rate=5r/s` and `burst=10` are a starting point for
# an alpha with a handful of real users, not a load-tested ceiling — the ship
# gate in docs/core-network-alpha.md calls for load-testing this gateway
# before it is trusted, and these numbers are exactly what that test should
# tune.
limit_req_zone $binary_remote_addr zone=thrylos_rpc:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=thrylos_rpc_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rpc.testnet.example;

    # certbot fills these in; left here so `nginx -t` has something to check
    # before the first certbot run.
    ssl_certificate     /etc/letsencrypt/live/rpc.testnet.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.testnet.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The node's own JSON-RPC (`chain-rpc`) refuses a header block over 8 KiB
    # and a body over 600 KiB (crates/rpc/src/server.rs); reject anything
    # larger here too, before it ties up a proxied connection.
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    location / {
        limit_req zone=thrylos_rpc burst=10 nodelay;
        limit_conn thrylos_rpc_conn 20;

        # The node accepts exactly one request per connection and closes;
        # match that here instead of pooling connections it will refuse.
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_pass http://127.0.0.1:26660;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rpc.testnet.example;
    location / {
        return 301 https://$host$request_uri;
    }
}
