name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Longer fuzzing keeps running even when the repository is quiet.
    - cron: "17 2 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo test --workspace

  formal-consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned TLC model checker
        run: |
          # v1.8.0 is a rolling prerelease whose asset is replaced after every
          # master build. Use the immutable stable release instead.
          curl -fsSL \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum -c -
      - name: Check consensus safety and eventual-synchrony liveness
        working-directory: formal/consensus
        run: >-
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC
          -workers 1 -config Consensus.cfg Consensus.tla

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [codecs, state_transitions, protocol_calls, metering_ratio, move_publish]
    env:
      # cargo-fuzz needs a nightly compiler (`-Zsanitizer=address`), and the
      # repository's rust-toolchain.toml pins 1.92.0, which the toolchain
      # installed below would otherwise lose to. This variable overrides the pin
      # for this job only.
      RUSTUP_TOOLCHAIN: nightly
      CARGO_FUZZ_VERSION: 0.12.0
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 600 || 30 }}
      THRYLOS_MAX_NS_PER_GAS: 1000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - name: Install cargo-fuzz
        # Built with the pinned toolchain, not the job's nightly: cargo-fuzz's
        # locked dependencies (rustix 0.36) do not compile on a current nightly.
        # Only running the fuzzers needs nightly.
        env:
          RUSTUP_TOOLCHAIN: 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
          cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" \
            --version "$CARGO_FUZZ_VERSION" cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: >-
          cargo fuzz run ${{ matrix.target }} --
          -max_len=4096 -max_total_time="$FUZZ_SECONDS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}

  # Known-vulnerability scan of the locked dependency graph. The ignore list
  # mirrors deny.toml's `[advisories] ignore` (each is explained there); keep
  # the two in step.
  audit:
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: |
          echo "${{ runner.tool_cache }}/cargo-audit/bin" >> "$GITHUB_PATH"
          cargo install --root "${{ runner.tool_cache }}/cargo-audit" \
            --version "$CARGO_AUDIT_VERSION" cargo-audit --locked
      - name: Audit Cargo.lock
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0320
          --ignore RUSTSEC-2026-0097 --ignore RUSTSEC-2026-0118
          --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2024-0436

  # The release script must produce the same bytes from the same commit
  # wherever it is checked out. Builds twice, in two different directories,
  # and compares checksums.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: b
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build in two directories
        run: |
          (cd a && scripts/release.sh > ../a.log)
          (cd b && scripts/release.sh > ../b.log)
      - name: Compare
        run: diff a/target/release-artifacts/SHA256SUMS b/target/release-artifacts/SHA256SUMS

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # Tier A crates must not pull in a source of nondeterminism. cargo-deny
  # bans are workspace-wide, so the per-crate "no rand in tier A" rule from
  # docs/spec.md's determinism table is checked here instead.
  #
  # chain-exec is deliberately excluded: `move-vm-runtime` itself (not a
  # dev-dependency) pulls in `rand` transitively — see deny.toml's comment
  # on [sources]. This checks first-party code doesn't introduce its own
  # randomness; it isn't a guarantee about the pinned MoveVM's internals.
  tier-a-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: No rand in tier A dependency trees
        run: |
          set -euo pipefail
          for crate in chain-types chain-state chain-modules \
                       chain-consensus chain-engine-api chain-signer; do
            # Not `cargo tree -i rand`: once the lockfile has more than
            # one `rand` version anywhere (true today), `-i rand` alone
            # is ambiguous and errors out — and with stderr redirected
            # away, that error previously looked identical to "no rand
            # found", silently passing regardless of the real answer.
            # Listing normal deps and grepping for the name textually
            # doesn't have that failure mode.
            if cargo tree -p "$crate" -e normal 2>&1 | grep -qi 'rand'; then
              echo "::error::$crate depends on rand (tier A must be deterministic)"
              exit 1
            fi
          done
