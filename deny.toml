# cargo-deny config. Run with `cargo deny check`.
#
# Note: cargo-deny bans apply workspace-wide; it has no native concept of
# "banned only for tier A crates". The determinism table's "no rand in tier A
# dependency tree" rule is checked per-crate in CI instead
# (see .github/workflows/ci.yml, job `tier-a-deps`) with
# `cargo tree -p <tier-A-crate> -i rand`. chain-exec is deliberately
# excluded from that check: `move-vm-runtime` itself (not a dev-dependency)
# pulls in `rand` transitively, almost certainly for internal hash-table
# seeding rather than anything that affects Move bytecode's deterministic
# output — Sui runs this exact VM in production consensus. This is a
# sanctioned exception for the pinned MoveVM dependency, not a loosening
# of the rule for first-party code. chain-consensus carries the same
# kind of exception for the pinned Malachite dependency — see below.

[graph]
all-features = false

[advisories]
yanked = "deny"
# Transitive advisories inside the pinned MoveVM dependency tree
# (move-vm-runtime et al., see Cargo.toml), not first-party and not
# something patchable without forking. Revisit when the pinned rev is
# deliberately bumped.
ignore = [
    "RUSTSEC-2024-0384", # `instant` unmaintained, via parking_lot v0.11.2 (move-vm-runtime)
    "RUSTSEC-2024-0320", # `yaml-rust` unmaintained, via serde_yaml (move-compiler toolchain)
    "RUSTSEC-2026-0097", # `rand` 0.7.3 unsound only with a custom logger touching thread_rng from inside it, which nothing here does
    # `hickory-proto`'s two DNS-response-parsing vulnerabilities and
    # `paste`'s unmaintained status all come from `arc-malachitebft-test`
    # (a chain-consensus dev-dependency only, pulled in for the Malachite
    # proof-of-life test — see tests/malachite_proof_of_life.rs) via
    # libp2p's DNS-based peer discovery. This proof-of-life does no
    # networking at all, so the vulnerable DNS-parsing code is compiled
    # into the test binary but never executed. Revisit if chain-consensus
    # ever exercises real networking through this dependency.
    "RUSTSEC-2026-0118", # hickory-proto: NSEC3 unbounded loop
    "RUSTSEC-2026-0119", # hickory-proto: O(n^2) name compression CPU exhaustion
    "RUSTSEC-2024-0436", # `paste` unmaintained
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots: Mozilla's compiled-in CA root bundle (from the CCADB),
    # used by `thrylos`'s HTTPS RPC client
    # (`crates/node/src/remote_rpc.rs`) to verify TLS without an OS trust
    # store. The whole crate — code and the underlying CCADB certificate
    # data alike — is licensed CDLA-Permissive-2.0, a permissive license
    # with no copyleft or attribution burden beyond what MIT/Apache-2.0
    # already require here.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/MystenLabs/sui", "https://github.com/circlefin/malachite"]
