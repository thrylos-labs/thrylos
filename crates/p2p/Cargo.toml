[package]
name = "chain-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Authenticated transport and bounded ingress"

# A deliberately narrower lint set than the workspace's tier-A table
# (`[lints] workspace = true`), not that table itself: this crate's
# failure mode is "Halt via DoS" (a local crash/hang), not "Fork", so
# panics still matter (denied below) but the fork-risk-specific
# integer-division and float-determinism rules do not apply.
# `arithmetic_side_effects` is kept, though, for the same DoS reason as
# the rest: release builds have overflow checks on, so an unchecked
# overflow on peer-influenced numbers is a remotely triggerable panic.
# (`disallowed_methods`
# is a separate case — see `clippy.toml`'s comment and `src/lib.rs`'s
# crate-level `#![allow(clippy::disallowed_methods)]`: that lint fires
# workspace-wide regardless of this table, so this crate overrides it
# in source instead.)
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[dependencies]
chain-consensus = { path = "../consensus", version = "0.1.0" }
chain-engine-api = { path = "../engine-api", version = "0.1.0" }
chain-types = { path = "../types", version = "0.1.0" }
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true

[dev-dependencies]
blst.workspace = true
