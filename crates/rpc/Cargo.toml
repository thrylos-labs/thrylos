[package]
name = "chain-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "JSON-RPC, tracing"

# Public-facing and parses untrusted input, so a panic here is a remote
# crash: the same panic-freedom set as chain-p2p. The fork-determinism
# arithmetic rules do not apply (nothing here is consensus-critical), but
# release builds have overflow checks on, so see the arithmetic lint below.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[dependencies]
chain-text = { path = "../text", version = "0.1.0" }
chain-types = { path = "../types", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
