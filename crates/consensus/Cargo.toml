[package]
name = "chain-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BFT engine, fork choice, evidence detection"

[lints]
workspace = true

[dependencies]
chain-engine-api = { path = "../engine-api", version = "0.1.0" }
chain-signer = { path = "../signer", version = "0.1.0" }
chain-state = { path = "../state", version = "0.1.0" }
chain-types = { path = "../types", version = "0.1.0" }
malachite-core-consensus.workspace = true
malachite-core-driver.workspace = true
malachite-core-types.workspace = true
malachite-metrics.workspace = true

[dev-dependencies]
# A dev-dependency cycle on purpose: chain-node builds on this crate, and its
# file-backed storage is what the restart tests run against.
chain-node = { path = "../node", version = "0.1.0" }
tempfile.workspace = true
blst.workspace = true
chain-exec = { path = "../exec", version = "0.1.0" }
chain-modules = { path = "../modules", version = "0.1.0" }
ed25519-dalek.workspace = true
proptest.workspace = true
malachite-test.workspace = true
