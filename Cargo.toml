[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/state",
    "crates/exec",
    "crates/modules",
    "crates/consensus",
    "crates/engine-api",
    "crates/signer",
    "crates/db",
    "crates/p2p",
    "crates/mempool",
    "crates/rpc",
    "crates/genesis",
    "crates/node",
    "crates/text",
    "crates/movetools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
# Nothing here is meant for crates.io: the node is built from this repository.
publish = false

[workspace.dependencies]
blake3 = "1"
blst = "0.3"
ed25519-dalek = "2"
getrandom = "0.3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# `thrylos`'s only client for a public testnet gateway (`docs/core-network-alpha.md`,
# "Secure public RPC access"): a pure-Rust TLS 1.2/1.3 client so the CLI can
# reach an HTTPS RPC gateway without linking OpenSSL. `ring` is pinned as the
# one crypto provider so `rustls::ClientConfig::builder()` never has to guess
# between it and `aws-lc-rs`. `webpki-roots` is Mozilla's compiled-in CA
# bundle: no OS trust-store integration to get wrong, and identical behavior
# on every platform this CLI runs on.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

# MoveVM, pinned to a specific MystenLabs/sui commit (tag testnet-v1.80.0).
# `docs/spec.md`, "Execution": "MoveVM at a pinned version, adopted
# unmodified." There is no actively-maintained, crates.io-published
# vendor-neutral Move VM any more (the original move-language/move repo
# was archived May 2024); this is a git dependency into Sui's production
# monorepo, scoped to `external-crates/move`, which is its own nested
# Cargo workspace (excluded from Sui's top-level one) and carries the
# same tier-A-style clippy discipline (forbid unsafe, deny unwrap/panic/
# arithmetic-side-effects) this workspace already enforces on itself.
# Bump the rev deliberately, not automatically.
move-vm-runtime = { version = "0.1.0", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }
move-core-types = { version = "0.0.4", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }
move-binary-format = { version = "0.0.3", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }
move-compiler = { version = "0.0.1", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }
move-vm-config = { version = "0.1.0", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }
move-bytecode-verifier = { version = "0.1.0", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }
move-bytecode-verifier-meter = { version = "0.1.0", git = "https://github.com/MystenLabs/sui", rev = "ceaaff1cc84c1ba2f12c4e7928914ece81fbdd0f" }

# Malachite's BFT consensus engine, pinned to a specific circlefin/malachite
# commit. `docs/spec.md`, "Consensus": "Use an existing engine (Malachite
# or a CometBFT-class Rust implementation) rather than a new protocol."
# The canonical repo moved when Informal Systems' Malachite team joined
# Circle to build "Arc" — circlefin/malachite is now the actively
# maintained one (informalsystems/malachite is the comparatively stale
# fork). It's alpha, unaudited software ("provided as is... use at your
# own risk", per the project itself) — a disclosed, accepted risk, since
# there's no more mature Rust BFT alternative to reuse instead.
#
# Depending on the low-level "core consensus" crates specifically (not
# the higher-level channel-based or actor-based integration layers,
# which pull in tokio/libp2p and an actor runtime): the core library is
# explicitly "pure ... does not perform any input/output nor result in
# side effects ... stateless", matching this workspace's own
# architecture far better than the higher-level options would.
# Package names carry an "arc-" prefix upstream; aliased here to drop it.
malachite-core-consensus = { version = "0.8.0", package = "arc-malachitebft-core-consensus", git = "https://github.com/circlefin/malachite", rev = "72143f6c99a98452b587e1c392bdb80944eb2232" }
malachite-core-types = { version = "0.8.0", package = "arc-malachitebft-core-types", git = "https://github.com/circlefin/malachite", rev = "72143f6c99a98452b587e1c392bdb80944eb2232" }
malachite-core-driver = { version = "0.8.0", package = "arc-malachitebft-core-driver", git = "https://github.com/circlefin/malachite", rev = "72143f6c99a98452b587e1c392bdb80944eb2232" }
malachite-metrics = { version = "0.8.0", package = "arc-malachitebft-metrics", git = "https://github.com/circlefin/malachite", rev = "72143f6c99a98452b587e1c392bdb80944eb2232" }
malachite-test = { version = "0.8.0", package = "arc-malachitebft-test", git = "https://github.com/circlefin/malachite", rev = "72143f6c99a98452b587e1c392bdb80944eb2232" }

# MDBX bindings for chain-db's flat key-value store (`docs/spec.md`,
# "State, storage and sync": "a flat key-value store (MDBX or redb)").
# `signet-libmdbx` (init4tech/mdbx) rather than the older `libmdbx`
# crate (vorot93/libmdbx-rs, MPL-2.0 — not in this workspace's license
# allowlist): it's a fork of reth's own libmdbx-rs, dual MIT/Apache-2.0,
# and more recently maintained. Vendors libmdbx itself, which relicensed
# to Apache-2.0 as of v0.13 (May 2024) — confirmed by reading the
# vendored LICENSE file at this fork's pinned submodule commit, not
# assumed from the wrapper crate's own license field.
libmdbx = { package = "signet-libmdbx", version = "0.8.3" }

# Tier A lints: crates whose output must be byte-identical on every machine.
# Opt in per crate with `[lints] workspace = true`. Tier B/C crates omit it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

[profile.release]
overflow-checks = true
